function renderStandings(){return '<div class="panel-head"><div><h2>Standings</h2><p>League table and current season positions.</p></div><select class="season" aria-label="Select season"><option>2026/27</option><option>2025/26</option></select></div>'+empty("Standings will appear here")}
function renderFixtures(){return '<div class="panel-head"><div><h2>Fixtures & results</h2><p>Browse matchdays, scores and set-by-set results.</p></div><select class="season" aria-label="Select round"><option>All rounds</option><option>Regular season</option><option>Playoffs</option></select></div>'+empty("No matches loaded")}
function renderDetail(){const id=new URLSearchParams(location.search).get("competition"),c=competitions.find(x=>x.id===id);if(!c){history.replaceState({},"",location.pathname);renderDirectory();return}document.title=c.name+" | Volleyball";const content=activeTab==="Overview"?renderOverview(c):activeTab==="Standings"?renderStandings():activeTab==="Fixtures & Results"?renderFixtures():empty(activeTab+" data will appear here");app.innerHTML=header()+'<a class="back" href="./index.html">← All competitions</a><section class="league-hero"><div><div class="eyebrow-mini">'+esc(c.kind)+' · '+esc(c.season)+'</div><h1>'+esc(c.name)+'</h1><p>'+esc(c.detail)+' — '+esc(c.desc)+'</p></div><div class="league-emblem" aria-hidden="true">'+c.icon+'</div></section><div class="healthbar"><span class="dot"></span><strong>Season data not connected</strong><span>Layout ready · live results and statistics will appear when a data source is added.</span></div><div class="section-heading"><div><h2>Explore this competition</h2><p>Choose a workspace for '+esc(c.name)+'.</p></div></div><section class="tools"><a href="#panel" data-open-tab="Standings" class="tool"><div class="tool-head"><span class="tool-icon">🏆</span><span class="tag">League table</span><span class="arrow">↗</span></div><h3>Standings</h3><p>Ranks, matches played, wins, losses and points.</p></a><a href="#panel" data-open-tab="Fixtures & Results" class="tool"><div class="tool-head"><span class="tool-icon">🗓️</span><span class="tag">Match centre</span><span class="arrow">↗</span></div><h3>Fixtures & results</h3><p>Browse matchdays and set-by-set scores.</p></a><a href="#panel" data-open-tab="Teams" class="tool"><div class="tool-head"><span class="tool-icon">🏟️</span><span class="tag">Club directory</span><span class="arrow">↗</span></div><h3>Teams</h3><p>Explore clubs, rosters and season performance.</p></a><a href="#panel" data-open-tab="Statistics" class="tool"><div class="tool-head"><span class="tool-icon">📊</span><span class="tag">Performance</span><span class="arrow">↗</span></div><h3>Stats Tracker</h3><p>Player leaders, team totals and match stats.</p></a></section><div class="tabs" role="tablist" aria-label="Competition sections">'+tabs.map(t=>'<button class="tab '+(activeTab===t?"active":"")+'" role="tab" aria-selected="'+(activeTab===t)+'" data-tab="'+t+'">'+t+'</button>').join("")+'</div><section class="panel" id="panel" role="tabpanel">'+(activeTab==="Overview"?'<div class="panel-head"><div><h2>Competition overview</h2><p>Season snapshot for '+esc(c.name)+'.</p></div><select class="season" aria-label="Select season"><option>'+esc(c.season)+'</option></select></div>':"")+content+'</section>'+footer();app.querySelectorAll("[data-tab],[data-open-tab]").forEach(el=>el.addEventListener("click",e=>{e.preventDefault();activeTab=el.dataset.tab||el.dataset.openTab;renderDetail();document.getElementById("panel").scrollIntoView({behavior:"smooth",block:"start"})}))}
function route(){if(new URLSearchParams(location.search).has("competition"))renderDetail();else renderDirectory()}window.addEventListener("popstate",route);document.addEventListener("click",e=>{const a=e.target.closest('a[href*="?competition="]');if(!a)return;e.preventDefault();history.pushState({},"",a.href);activeTab="Overview";route();window.scrollTo(0,0)});route();
</script></body></html>
